# TLS termination for payment-api (fictional demo configuration)
server {
    listen 443 ssl;
    server_name api.acme-payments.example;

    ssl_certificate     /etc/nginx/certs/api.acme-payments.example.crt;
    ssl_certificate_key /etc/nginx/certs/api.acme-payments.example.key;

    # legacy clients still connect with old protocol versions
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA:DES-CBC3-SHA:RC4-SHA;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://payment-api:8080;
    }
}
