rule_id: PY-ECDSA-ECDSA-001
rule_version: 1.0.0
language: python
description: ECDSA via the python-ecdsa package
library: ecdsa
api: ecdsa
algorithm: ECDSA
primitive: public-key
operation: signature
confidence: 0.95
match:
  type: python_call
  value_from: fqn
  value_map:
    ecdsa.SigningKey.generate:
      operation: key_generation
    ecdsa.SigningKey.*:
      operation: signature
    ecdsa.VerifyingKey.*:
      operation: verification
