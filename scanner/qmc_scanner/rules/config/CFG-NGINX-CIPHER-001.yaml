rule_id: CFG-NGINX-CIPHER-001
rule_version: 1.0.0
language: config
description: ssl_ciphers names ECDHE/ECDH key exchange (quantum-vulnerable key establishment)
library: nginx
api: ssl_ciphers
algorithm: ECDH
primitive: public-key
operation: key_agreement
confidence: 0.75
match:
  type: directive
  file_pattern: (?i)\.(?:conf|nginx)$
  flags:
  - IGNORECASE
  pattern: ^\s*ssl_ciphers\s+(?P<value>[^;]+);?
  value_map:
    ecdhe-*: {}
    ecdh-*: {}
    eecdh*: {}
    kecdhe*: {}
    ecdhe: {}
  skip_prefixes:
  - '!'
  - '-'
