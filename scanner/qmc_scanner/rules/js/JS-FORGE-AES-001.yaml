rule_id: JS-FORGE-AES-001
rule_version: 1.0.0
language: js
description: node-forge AES ciphers
library: node-forge
api: forge.cipher.createCipher
algorithm: AES
primitive: symmetric
operation: encryption
confidence: 0.95
match:
  type: regex
  file_requires: '[''\"]node-forge[''\"]'
  pattern: \bforge\s*\.\s*cipher\s*\.\s*create(?P<alg>Cipher|Decipher)\s*\(\s*['\"]AES-
  value_group: alg
  value_map:
    cipher:
      operation: encryption
    decipher:
      operation: decryption
