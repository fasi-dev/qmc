rule_id: JS-NODE-CRYPTO-RSA-ENC-001
rule_version: 1.0.0
language: js
description: publicEncrypt / privateDecrypt (RSA only in node:crypto)
library: node:crypto
api: publicEncrypt
algorithm: RSA
primitive: public-key
operation: encryption
confidence: 0.95
match:
  type: regex
  file_requires: '[''"](?:node:)?crypto[''"]'
  pattern: \b(?P<alg>publicEncrypt|privateDecrypt)\s*\(
  value_group: alg
  value_map:
    publicencrypt:
      operation: encryption
    privatedecrypt:
      operation: decryption
