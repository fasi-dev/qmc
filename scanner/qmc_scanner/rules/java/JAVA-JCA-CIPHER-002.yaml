rule_id: JAVA-JCA-CIPHER-002
rule_version: 1.0.0
language: java
description: Cipher.getInstance("AES...") symmetric encryption
library: javax.crypto
api: Cipher.getInstance
algorithm: AES
primitive: symmetric
operation: encryption
confidence: 0.95
match:
  type: regex
  pattern: \bCipher\s*\.\s*getInstance\s*\(\s*"AES(?:_(?P<bits>128|192|256))?[A-Za-z0-9/_.+-]*"
  key_size_group: bits
  refine:
  - window: 400
    pattern: \bENCRYPT_MODE\b
    operation: encryption
  - window: 400
    pattern: \bDECRYPT_MODE\b
    operation: decryption
  file_requires: java\.security|javax\.crypto|org\.bouncycastle
