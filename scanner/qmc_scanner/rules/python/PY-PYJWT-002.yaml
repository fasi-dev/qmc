rule_id: PY-PYJWT-002
rule_version: 1.0.0
language: python
description: JWT verification with literal algorithms (PyJWT / python-jose)
library: pyjwt
api: jwt.decode
algorithm: ECDSA
primitive: public-key
operation: verification
confidence: 0.92
match:
