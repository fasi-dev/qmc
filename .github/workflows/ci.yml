name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e scanner pytest
      - name: Scanner tests
        working-directory: scanner
        run: pytest -q
      - name: Evaluation set (precision / recall / F1)
        working-directory: scanner
        run: python -m eval.evaluate

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt -e scanner
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5          # UI tests start the real backend
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -e scanner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - name: UI tests against a real backend
        run: npm test
        working-directory: frontend
        env:
          QMC_PYTHON: python

  docker:
    runs-on: ubuntu-latest
    needs: [scanner, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t qmc-backend .
      - run: docker build -t qmc-frontend frontend
