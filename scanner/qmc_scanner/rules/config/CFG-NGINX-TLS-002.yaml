rule_id: CFG-NGINX-TLS-002
rule_version: 1.0.0
language: config
description: TLS termination configured via ssl_certificate
library: nginx
api: ssl_certificate
algorithm: TLS
primitive: protocol
operation: termination
confidence: 0.8
match:
  type: directive
  file_pattern: (?i)\.(?:conf|nginx)$
  flags:
  - IGNORECASE
  pattern: ^\s*ssl_certificate\s+(?P<value>[^;]+);?
  value_map:
    '*': {}
