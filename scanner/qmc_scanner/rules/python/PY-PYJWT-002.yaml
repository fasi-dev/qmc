      algorithm: ECDSA
    ES384:
      algorithm: ECDSA
    ES512:
      algorithm: ECDSA
    ES256K:
      algorithm: ECDSA
    RS256:
      algorithm: RSA
    RS384:
      algorithm: RSA
    RS512:
      algorithm: RSA
    PS256:
      algorithm: RSA
    PS384:
      algorithm: RSA
    PS512:
      algorithm: RSA
    EdDSA:
      algorithm: EdDSA
    HS256:
      algorithm: HMAC
      primitive: mac
      operation: mac_verification
    HS384:
      algorithm: HMAC
      primitive: mac
      operation: mac_verification
    HS512:
      algorithm: HMAC
      primitive: mac
      operation: mac_verification
