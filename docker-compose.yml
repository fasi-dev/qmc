# Quantum Migration Copilot - local stack (UI http://localhost:5173, API http://localhost:8000)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      QMC_DATA_DIR: /data
      QMC_ADMIN_TOKEN: "${QMC_ADMIN_TOKEN:-}"          # optional operator token (lists all scans)
      QMC_RETENTION_HOURS: "${QMC_RETENTION_HOURS:-24}"
      QMC_RATE_LIMIT: "${QMC_RATE_LIMIT:-20}"
    volumes:
      - qmc-data:/data
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qmc-data:
