    Crypto.Hash.SHA3_512.new:
      algorithm: SHA-3
    Cryptodome.Hash.SHA1.new:
      algorithm: SHA-1
    Cryptodome.Hash.SHA256.new:
      algorithm: SHA-256
    Cryptodome.Hash.SHA384.new:
      algorithm: SHA-384
    Cryptodome.Hash.SHA512.new:
      algorithm: SHA-512
    Cryptodome.Hash.SHA3_256.new:
      algorithm: SHA-3
    Cryptodome.Hash.SHA3_384.new:
