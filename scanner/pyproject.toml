[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmc-scanner"
version = "0.1.0"
description = "Deterministic static cryptographic discovery engine (Quantum Migration Copilot)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["qmc_scanner*"]

[tool.setuptools.package-data]
qmc_scanner = ["rules/*/*.yaml"]
