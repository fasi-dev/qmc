rule_id: JS-JOSE-001
rule_version: 1.0.0
language: js
description: JWT signing algorithm (alg / algorithm) in a jose/jsonwebtoken file
library: jose
api: alg
algorithm: ECDSA
primitive: public-key
operation: signature
confidence: 0.92
match:
  type: regex
  file_requires: '[''\"](?:jose|jsonwebtoken|jws|jwt-simple|@panva/jose)[''\"]'
  pattern: \balg(?:orithm)?\s*:\s*['\"](?P<alg>(?:ES256K|ES256|ES384|ES512|RS256|RS384|RS512|PS256|PS384|PS512|EdDSA))['\"]
  value_group: alg
  value_map:
    es*:
      algorithm: ECDSA
    rs*:
      algorithm: RSA
    ps*:
      algorithm: RSA
    eddsa:
      algorithm: EdDSA
