rule_id: JS-FORGE-ED25519-001
rule_version: 1.0.0
language: js
description: node-forge Ed25519
library: node-forge
api: forge.pki.ed25519
algorithm: EdDSA
primitive: public-key
operation: signature
confidence: 0.95
match:
  type: regex
  file_requires: '[''\"]node-forge[''\"]'
  pattern: \bforge\s*\.\s*(?:pki\s*\.\s*)?ed25519\s*\.\s*(?P<alg>generateKeyPair|sign|verify)\b
  value_group: alg
  value_map:
    generatekeypair:
      operation: key_generation
    sign:
      operation: signature
    verify:
      operation: verification
